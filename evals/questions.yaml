    ST-TIS: https://github.com/GuanyaoLI/ST-TIS.
  evidence: ["github.com/advectionmatern", "github.com/GuanyaoLI/ST-TIS"]
  sources:
    - {file: papers/2201.00001.pdf, pages: [4]}
    - {file: papers/2201.00008.pdf, pages: [8]}

- id: hop-10
  group: multi_hop
  split: dev
  question: >-
    In the stroke length-of-stay study at King Fahad Bin Abdul-Aziz Hospital
