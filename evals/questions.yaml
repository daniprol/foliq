  answer: ST-TIS ran each approach 10 times; the traffic signal control paper averages three independent results.
  evidence: ["run 10 times", "three independent results"]
  sources:
    - {file: papers/2201.00008.pdf, pages: [8]}
    - {file: papers/2201.00006.pdf, pages: [5]}

- id: hop-08
  group: multi_hop
  split: heldout
