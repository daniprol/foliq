# ------------------------------------------------------------------ multi_hop

- id: hop-01
  group: multi_hop
  split: dev
  question: >-
    In the traffic signal control paper with MaxQueue and QL-XLight, on which
    dataset does QL-FRAP improve the most over MaxPressure, and what is the
    average arrival rate of that dataset?
  answer: HangZhou 2 (-9.73%), whose average arrival rate is 1.94 vehicles per second.
  evidence: ["9.73", "1.94"]
  sources:
    - {file: papers/2201.00006.pdf, pages: [5, 6]}

- id: hop-02
  group: multi_hop
  split: dev
  question: >-
    Which GPUs were used by the ST-TIS traffic forecasting paper and by the
    Confidence Optimization score (GAX) paper?
  answer: ST-TIS used an NVIDIA RTX 2080 Ti; the GAX paper used an NVIDIA GeForce GTX 1050 (4 GB).
  evidence: ["RTX2080 Ti", "GTX 1050"]
  sources:
    - {file: papers/2201.00008.pdf, pages: [8]}
    - {file: papers/2201.00009.pdf, pages: [5, 10]}

- id: hop-03
  group: multi_hop
  split: dev
  question: What initial learning rates do CA-MKD and ST-TIS use?
  answer: >-
    CA-MKD uses 0.1 (0.05 for MobileNetV2, ShuffleNetV1 and ShuffleNetV2);
    ST-TIS uses 0.001.
  evidence: ["initial learning rate is set to 0.1", "learning rate is set as 0.001"]
  sources:
    - {file: papers/2201.00007.pdf, pages: [3]}
    - {file: papers/2201.00008.pdf, pages: [8]}

- id: hop-04
  group: multi_hop
  split: heldout
  question: >-
    Which cities do the traffic datasets come from in the traffic signal
    control paper (MaxQueue) and in the ST-TIS traffic forecasting paper?
  answer: Jinan and Hangzhou for traffic signal control; New York City (NYC-Taxi and NYC-Bike) for ST-TIS.
  evidence: ["Jinan", "New York City"]
  sources:
    - {file: papers/2201.00006.pdf, pages: [5]}
    - {file: papers/2201.00008.pdf, pages: [7]}

- id: hop-05
  group: multi_hop
  split: dev
  question: >-
    Does the 2019 national total of taxable beer in bottles and cans in the
    TTB state-by-state workbook match the 2019 cumulative figure in the TTB
    December 2019 monthly report? Give both numbers.
  answer: >-
    Yes. The state workbook total is 148,590,625.56 barrels and the December
    2019 report shows 148,590,626 barrels cumulative to date.
  evidence: ["148590625.56", "148590626"]
  sources:
    - {file: spreadsheets/ttb_brewery_state_2008-2019.xlsx, sheet: Taxable Bottles and Cans}
    - {file: spreadsheets/ttb_monthly_stats_2019-12.xlsx, sheet: Consolidated}

- id: hop-06
  group: multi_hop
  split: dev
  question: >-
    In the ST-TIS paper, which baseline has the shortest total training time
    on NYC-Taxi, and how many parameters does it have?
  answer: ST-ResNet (3077.51 s in total), with 4,917,041 parameters.
  evidence: ["3077.51", "4,917,041"]
  sources:
    - {file: papers/2201.00008.pdf, pages: [9]}

- id: hop-07
  group: multi_hop
  split: dev
  question: >-
    How many times was each experiment run in the ST-TIS paper, and how many
