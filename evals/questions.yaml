# The questions of the agent eval.
#
# Every answer was checked by hand in the original file. `sources` lists where
# the answer is: a path inside the corpus folder, plus the PDF pages or the
# spreadsheet sheet. Unanswerable questions have no sources: the right reply
# is NOT FOUND. `evidence` holds short pieces of the original text (as
# pdftotext or openpyxl read it) that a passage with the answer contains; the
# retrieval check looks for them in what foliq returns.
#
# `split: heldout` questions are never used while tuning foliq or its skill.
# Run them only for a final report (`-T split=heldout`).
#
# Groups:
#   single_fact   one answer, in one place of one named document
#   tables        a number from a PDF table or a spreadsheet cell
#   multi_hop     needs two passages, from two pages or two documents
#   needle        names no document; asked over 10, 100 and 1,000 papers
#   unanswerable  the corpus does not have the answer

# ---------------------------------------------------------------- single_fact

- id: fact-01
  group: single_fact
  split: dev
  question: >-
    In the paper "Knowledge intensive state design for traffic signal control",
    how long is the yellow time that follows each green signal in the
    simulator experiments?
  answer: Three seconds (followed by two seconds of all red).
  evidence: ["three-second yellow"]
  sources:
    - {file: papers/2201.00006.pdf, pages: [5]}

- id: fact-02
  group: single_fact
  split: dev
  question: >-
    In the paper on confidence-aware multi-teacher knowledge distillation
    (CA-MKD), what value is the hyper-parameter beta set to?
  answer: 50 (beta = 50 throughout the experiments).
  evidence: ["CA-MKD to 50"]
  sources:
    - {file: papers/2201.00007.pdf, pages: [3]}

- id: fact-03
  group: single_fact
  split: dev
  question: >-
    Which GPU was ST-TIS ("A Lightweight and Accurate Spatial-Temporal
    Transformer for Traffic Forecasting") trained on?
  answer: An NVIDIA RTX 2080 Ti.
  evidence: ["RTX2080 Ti"]
  sources:
    - {file: papers/2201.00008.pdf, pages: [8]}

- id: fact-04
  group: single_fact
  split: heldout
  question: >-
    In the paper "Augmentative eXplanation and the Distributional Gap of
    Confidence Optimization Score", what is the value of the similarity loss
    factor l_s?
  answer: 100.
  evidence: ["100 is the similarity loss factor"]
  sources:
    - {file: papers/2201.00009.pdf, pages: [5]}

- id: fact-05
  group: single_fact
  split: dev
  question: >-
    In "Modeling Advection on Directed Graphs using Matérn Gaussian Processes
    for Traffic Flow", how is the data split into training and test data?
  answer: 70% of the data for training and 30% for testing (hold-out cross validation).
  evidence: ["training (70% of the data)"]
  sources:
    - {file: papers/2201.00001.pdf, pages: [4]}

- id: fact-06
  group: single_fact
  split: dev
  question: >-
    In the literature review on length of stay prediction for stroke patients,
    how many records of hospital claims does the Heritage Health Prize dataset
    contain?
  answer: 1,048,576 records.
  evidence: ["1,048,576 records"]
  sources:
    - {file: papers/2201.00005.pdf, pages: [4]}

- id: fact-07
  group: single_fact
  split: heldout
  question: >-
    Which two benchmark problems are used in "Robust reliability-based topology
    optimization under random-field material model"?
  answer: The cantilever beam and the L-shaped beam.
  evidence: ["the cantilever and the"]
  sources:
    - {file: papers/2201.00004.pdf, pages: [7]}

- id: fact-08
  group: single_fact
  split: dev
  question: >-
    In the paper on simulating local fields in carbon nanotube reinforced
    composites for an infinite strip with voids, which MATLAB function is used
    to solve the boundary integral equation with the generalized Neumann
    kernel?
  answer: The MATLAB function fbie.
  evidence: ["MATLAB function fbie"]
  sources:
    - {file: papers/2201.00003.pdf, pages: [8]}

- id: fact-09
  group: single_fact
  split: dev
  question: >-
    In the paper on the time-dependent Duhamel renormalization (TDSR) method
    with multiple conservation and dissipation laws, which fourth-order
    time-stepping scheme are the TDSR results compared with?
  answer: The exponential time differencing fourth order Runge-Kutta scheme (ETDRK4).
  evidence: ["ETDRK4"]
  sources:
    - {file: papers/2201.00002.pdf, pages: [6, 10, 11, 14]}

- id: fact-10
  group: single_fact
  split: dev
  question: >-
    According to the TTB statistical report on beer for December 2019, what
    tax rate per barrel applied in 2018-2019?
  answer: $3.50 / $16.00 per barrel (it was $7.00 / $18.00 in 2017 and before).
  evidence: ["$3.50/$16.00"]
  sources:
    - {file: spreadsheets/ttb_monthly_stats_2019-12.xlsx, sheet: Consolidated}

