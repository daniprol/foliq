[project]
name = "foliq-evals"
version = "0.1.0"
description = "Does foliq help AI agents answer questions about documents? An Inspect eval."
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.287",
    "anthropic",   # the model provider; add yours (inspect-ai already brings openai)
    "pyyaml",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foliq_eval"]
