# Documentation site, built with Zensical (https://zensical.org).
#     uv run --only-group docs zensical serve   # preview on http://localhost:8000
# Published to GitHub Pages by .github/workflows/docs.yml on every push to main.

[project]
site_name = "foliq"
site_description = "Search, read and cite your documents from AI agents"
site_url = "https://daniprol.github.io/foliq/"
repo_url = "https://github.com/daniprol/foliq"
repo_name = "daniprol/foliq"
edit_uri = "edit/main/docs/"
nav = [
  { "Get started" = "index.md" },
  { "Command line" = "cli.md" },
  { "Python" = "python.md" },
  { "Agent tools" = "agent-tools.md" },
  { "Formats" = "formats.md" },
  { "How it works" = "how-it-works.md" },
  { "Access rules" = "access.md" },
  { "Plugins" = "plugins.md" },
]

[project.theme]
language = "en"  # also the language of the built-in search
features = [
  "content.action.edit",    # "edit this page" button
  "content.code.annotate",
  "content.code.copy",      # copy button on code blocks
  "content.tabs.link",      # switching a Python/Rust tab switches them all
  "navigation.footer",      # previous/next links
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",       # highlight the search terms on the page you open
]

# Follow the system's light/dark mode, with a toggle.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
# `--8<-- "crates/foliq/examples/custom_parser.rs"` includes a repository file, so examples are written (and tested) once.
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
