[package]
name = "foliq_python"
description = "The Python extension of foliq (`foliq._core`)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
foliq = { path = "crates/foliq" }
foliq-cli = { path = "crates/foliq-cli" }
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
serde = "1.0"
serde_json = "1.0"

[workspace]
members = [".", "crates/foliq-core", "crates/foliq", "crates/foliq-cli"]

# The single source of the version: the crates and the Python package (see `dynamic` in pyproject.toml).
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/daniprol/foliq"

[profile.release]
lto = "thin"
codegen-units = 1
