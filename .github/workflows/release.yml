name: Release

# Every push to main publishes a development build to TestPyPI, like `0.1.0a1.dev42`
# (the version in Cargo.toml plus `.dev<run number>`, since an index never takes a version twice).
# Push a tag like `v0.1.0a1` (the Python form of the Cargo.toml version) to publish that version
# to PyPI and create a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:  # the same as a push to main: a development build to TestPyPI

permissions:
  contents: read

# A newer push to main replaces a development build still in progress; releases always finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # to check that the tag is on main
      - uses: astral-sh/setup-uv@v7
      - name: Check the tag matches the version and is on main
        if: github.ref_type == 'tag'
        run: |
          # Cargo.toml says `0.1.0-alpha.1`; the tag uses the Python form, `v0.1.0a1`.
          version=$(uv run --no-project --with packaging python -c 'import tomllib; from packaging.version import Version; print(Version(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]))')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::Tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Stamp a development version
        if: github.ref_type != 'tag'
        run: uv run --no-project --python 3.12 scripts/stamp-dev-version.py ${{ github.run_number }}
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist

  wheels:
    name: Wheel (${{ matrix.target }}, ${{ matrix.runner }} ${{ matrix.manylinux }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        # The extension uses the stable ABI (abi3-py311): one wheel per platform covers every CPython >= 3.11.
        include:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto, smoke: true }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto, smoke: true }
          - { runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { runner: macos-latest, target: aarch64, smoke: true }
          - { runner: macos-latest, target: x86_64 }  # cross-compiled from Apple Silicon
          - { runner: windows-latest, target: x64, smoke: true }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Stamp a development version
        if: github.ref_type != 'tag'
        run: uv run --no-project --python 3.12 scripts/stamp-dev-version.py ${{ github.run_number }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --strip --out dist
      # Install the wheel on the oldest supported Python, import it and run the CLI.
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          uv run --isolated --no-project --python 3.11 --with dist/*.whl python -c "import foliq; print(foliq.__version__)"
          uvx --python 3.11 --from dist/*.whl foliq --version
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ strategy.job-index }}
          path: dist

  pypi:
    name: Publish to PyPI
    if: github.ref_type == 'tag'
    needs: [ci, sdist, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/foliq
    permissions:
      id-token: write  # trusted publishing: no API token anywhere
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    name: Publish to TestPyPI
    if: github.ref_type != 'tag'
    needs: [ci, sdist, wheels]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/foliq
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags="--generate-notes --verify-tag"
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then flags+=" --prerelease"; fi
          gh release create "$GITHUB_REF_NAME" $flags
